services:
  db:
    image: postgres:16-alpine
    container_name: expensemanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: expensemanager
      POSTGRES_PASSWORD: expensemanager
      POSTGRES_DB: expensemanager
    ports:
      - "5432:5432"
    volumes:
      - expensemanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensemanager -d expensemanager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  expensemanager_pgdata:
