services:
  db:
    image: postgres:16-alpine
    container_name: moneyos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneyos
      POSTGRES_PASSWORD: moneyos
      POSTGRES_DB: moneyos
    ports:
      - "5432:5432"
    volumes:
      - moneyos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyos -d moneyos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  moneyos_pgdata:
